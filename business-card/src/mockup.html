<!doctype html><html><head><meta charset="utf-8"><title>FlowwTech business card mockup</title>
<style>
* { margin: 0; box-sizing: border-box }
html, body { width: 1600px; height: 1100px; overflow: hidden }
body { position: relative;
  background:
    radial-gradient(1200px 800px at 38% 30%, #d9d6d0 0%, #c3c0ba 55%, #a9a69f 100%); }
#grain { position: absolute; inset: 0; opacity: .32; mix-blend-mode: multiply }
.card { position: absolute; width: 640px; height: 384px; border-radius: 3px; transform-origin: center }
.card img { width: 100%; height: 100%; display: block; border-radius: 3px }
.card::after { content: ""; position: absolute; inset: 0; border-radius: 3px; pointer-events: none;
  background: linear-gradient(125deg, rgba(255,255,255,.10) 0%, rgba(255,255,255,0) 38%, rgba(0,0,0,.06) 100%) }
.back  { left: 170px; top: 150px; transform: rotate(-8deg);
  box-shadow: 0 1px 0 #d8dbd9, 0 2px 0 #c9ccca, 0 4px 6px rgba(20,18,15,.18), 0 22px 40px -8px rgba(20,18,15,.35), 0 50px 90px -20px rgba(20,18,15,.30) }
.front { left: 790px; top: 540px; transform: rotate(5deg);
  box-shadow: 0 1px 0 #1a1d1e, 0 2px 0 #121415, 0 4px 6px rgba(10,8,6,.30), 0 26px 46px -8px rgba(10,8,6,.45), 0 60px 100px -24px rgba(10,8,6,.35) }
</style></head><body>
<svg id="grain" width="1600" height="1100"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="3" stitchTiles="stitch"/><feColorMatrix values="0 0 0 0 .5  0 0 0 0 .5  0 0 0 0 .5  0 0 0 .55 0"/></filter><rect width="100%" height="100%" filter="url(#n)"/></svg>
<div class="card back"><img src="../artwork/flowwtech-card-back.svg"></div>
<div class="card front"><img src="../artwork/flowwtech-card-front.svg"></div>
</body></html>
