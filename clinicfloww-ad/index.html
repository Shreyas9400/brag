<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="assets/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Inter"; font-weight: 100 900; font-display: block; src: url(assets/fonts/inter.woff2) format("woff2"); }
      :root {
        --navy: #0b1f4b;
        --royal: #2155d6;
        --teal: #1fb5aa;
        --slate: #4a5a78;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #f4f7fb; }
      #root { position: relative; width: 1920px; height: 1080px; overflow: hidden; font-family: Inter, ui-sans-serif, system-ui, sans-serif; color: var(--navy); background: #f4f7fb; }
      .clip { position: absolute; inset: 0; }

      /* ---- camera world: three parallax planes, 4400 x 1080 world units ---- */
      .layer { position: absolute; left: 0; top: 0; width: 4400px; height: 1080px; transform-origin: 0 0; will-change: transform; }
      .layer svg { display: block; width: 4400px; height: 1080px; overflow: visible; }
      #bg { filter: blur(1.6px); }
      #fg { filter: blur(14px); }

      /* ---- overlays ---- */
      #scrim { position: absolute; inset: 0; background: linear-gradient(90deg, rgba(247,250,253,0.94) 0%, rgba(247,250,253,0.82) 30%, rgba(247,250,253,0) 58%); }
      #scrim3 { position: absolute; inset: 0; opacity: 0; background: radial-gradient(ellipse 1100px 520px at 18% 24%, rgba(250,247,242,0.92) 0%, rgba(250,247,242,0.75) 45%, rgba(250,247,242,0) 100%); }
      #vignette { position: absolute; inset: 0; pointer-events: none; background: radial-gradient(ellipse 120% 100% at 50% 50%, rgba(11,31,75,0) 60%, rgba(11,31,75,0.10) 100%); }

      .headline { position: absolute; left: 132px; top: 50%; transform: translateY(-50%); font-size: 58px; line-height: 1.14; font-weight: 600; letter-spacing: 0.01em; text-transform: uppercase; }
      .headline .w { display: inline-block; opacity: 0; will-change: transform, opacity, filter; }
      .accent { color: var(--royal); }
      .accent-t { color: var(--teal); }

      #title3 { position: absolute; left: 132px; top: 196px; }
      #ra { font-size: 50px; font-weight: 700; letter-spacing: 0.14em; color: var(--navy); opacity: 0; white-space: nowrap; }
      #ra .t { color: #12867e; }
      #ra-sub { margin-top: 26px; font-size: 32px; font-weight: 400; color: var(--slate); letter-spacing: 0.005em; opacity: 0; }

      /* ---- end card ---- */
      #endcard { background: radial-gradient(ellipse 80% 70% at 50% 45%, #ffffff 0%, #f6f9fc 70%, #eef3f8 100%); opacity: 0; }
      #logo { position: absolute; left: 50%; top: 448px; width: 640px; transform: translate(-50%, -50%); opacity: 0; }
      #sweep { position: absolute; inset: 0; width: 1920px; height: 1080px; }
      #final { position: absolute; left: 0; right: 0; top: 646px; text-align: center; font-size: 40px; font-weight: 600; letter-spacing: 0.16em; color: var(--navy); }
      #final .w { display: inline-block; opacity: 0; }

      #grain { position: absolute; inset: 0; opacity: 0.05; mix-blend-mode: multiply; pointer-events: none; }
    </style>
  </head>

            <path id="conn" d="M1566 552 C1820 552 1980 430 2400 430 C2820 430 3040 655 3330 655" fill="none" stroke="url(#connGrad)" stroke-width="3" stroke-linecap="round" />

            <g id="lock" opacity="0">
              <circle cx="2400" cy="430" r="64" fill="url(#lockGlow)" />
              <circle id="lockRing" cx="2400" cy="430" r="40" fill="none" stroke="#1fb5aa" stroke-width="1.5" opacity="0.5" />
              <path id="shackle" d="M2389 427 v-11 a11 11 0 0 1 22 0 v11" fill="none" stroke="#0b1f4b" stroke-width="3.4" stroke-linecap="round" />
              <rect x="2383" y="425" width="34" height="27" rx="6" fill="#0b1f4b" />
              <circle cx="2400" cy="436" r="3.2" fill="#2ec4b6" />
              <rect x="2398.8" y="437" width="2.4" height="7" rx="1.2" fill="#2ec4b6" />
            </g>

            <g id="cHead" opacity="0">
              <circle r="26" fill="url(#headGlow)" />
              <circle r="4.5" fill="#ffffff" />
            </g>
          </svg>
        </div>

        <!-- foreground plane (out of focus) -->
        <div id="fg" class="layer">
          <svg viewBox="0 0 4400 1080" xmlns="http://www.w3.org/2000/svg">
            <g opacity="0.75">
              <ellipse cx="300" cy="1010" rx="60" ry="180" fill="#8fae99" transform="rotate(-28 300 1080)" />
              <ellipse cx="380" cy="1000" rx="56" ry="200" fill="#7c9f88" transform="rotate(8 380 1080)" />
              <ellipse cx="450" cy="1030" rx="50" ry="160" fill="#a3bfab" transform="rotate(30 450 1080)" />
            </g>
            <rect x="2050" y="0" width="18" height="1080" fill="#ffffff" opacity="0.7" />
            <rect x="2090" y="0" width="6" height="1080" fill="#d8e3ee" opacity="0.6" />
          </svg>
        </div>

        <div id="scrim"></div>
        <div id="scrim3"></div>
        <div id="vignette"></div>

        <div id="h1" class="headline"><span class="w">We</span> <span class="w">didn’t</span> <span class="w">move</span> <span class="w">your</span> <span class="w">clinic</span><br /><span class="w">to</span> <span class="w">the</span> <span class="w">cloud.</span></div>
        <div id="h2" class="headline"><span class="w">We</span> <span class="w">brought</span> <span class="w">your</span><br /><span class="w">clinic</span> <span class="w accent">to</span> <span class="w accent">you.</span></div>

        <div id="title3">
          <div id="ra">CLINICFLOWW <span class="t">REMOTE ACCESS</span></div>
          <div id="ra-sub">Access your clinic’s system securely, even when you’re away.</div>
        </div>
      </div>

      <!-- ===================== END CARD ===================== -->
      <div id="endcard" class="clip" data-start="18.6" data-duration="5.4" data-track-index="2">
        <img id="logo" src="assets/logo/clinicfloww-logo.svg" alt="ClinicFloww" />
        <svg id="sweep" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="sweepGrad" x1="600" y1="0" x2="1320" y2="0" gradientUnits="userSpaceOnUse">
              <stop offset="0" stop-color="#1fb5aa" stop-opacity="0" />
              <stop offset="0.2" stop-color="#1fb5aa" />
              <stop offset="0.6" stop-color="#2a8fe0" />
              <stop offset="1" stop-color="#1fb5aa" stop-opacity="0" />
            </linearGradient>
            <filter id="sGlow" x="-20%" y="-200%" width="140%" height="500%"><feGaussianBlur stdDeviation="6" /></filter>
          </defs>
          <path id="sweepGlow" d="M600 568 C800 600 1120 600 1320 562" fill="none" stroke="#1fb5aa" stroke-width="9" stroke-linecap="round" opacity="0.4" filter="url(#sGlow)" />
          <path id="sweepLine" d="M600 568 C800 600 1120 600 1320 562" fill="none" stroke="url(#sweepGrad)" stroke-width="3" stroke-linecap="round" />
        </svg>
        <div id="final"><span class="w">YOUR</span> <span class="w">CLINIC.</span> <span class="w accent">WHEREVER</span> <span class="w accent">YOU</span> <span class="w accent">ARE.</span></div>
      </div>

      <!-- static film grain (deterministic) -->
      <svg id="grain" class="clip" data-start="0" data-duration="24" data-track-index="3" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">
        <filter id="n"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="4" stitchTiles="stitch" /><feColorMatrix type="saturate" values="0" /></filter>
        <rect width="1920" height="1080" filter="url(#n)" />
      </svg>

      <audio id="score" class="clip" data-start="0" data-duration="24" data-track-index="4" src="assets/audio/clinicfloww-score.wav"></audio>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // ---------- helpers: deterministic sampled motion (no onUpdate callbacks) ----------
      const E = (name) => gsap.parseEase(name);
      const lerp = (a, b, u) => a + (b - a) * u;
      function drive(target, fn, t0, t1, fps) {
        const n = Math.max(1, Math.ceil((t1 - t0) * (fps || 24)));
        const dt = (t1 - t0) / n;
        tl.set(target, fn(0), t0);
        for (let i = 1; i <= n; i++) tl.to(target, Object.assign({ duration: dt, ease: "none" }, fn(i / n)), t0 + (i - 1) * dt);
      }

      // ---------- camera: centre (cx, cy) in world units + zoom ----------
      const K = [
        { t: 0.0, cx: 1080, cy: 540, z: 1.0 },
        { t: 7.0, cx: 1120, cy: 545, z: 1.6, ease: "power1.inOut" },   // slow push to the dashboard
        { t: 12.9, cx: 3560, cy: 575, z: 1.18, ease: "power2.inOut" }, // follow the connection
        { t: 19.6, cx: 3610, cy: 592, z: 1.3, ease: "sine.inOut" },    // gentle push on the dentist
      ];
      function camAt(t) {
        for (let i = 1; i < K.length; i++) {
          if (t <= K[i].t || i === K.length - 1) {
            const a = K[i - 1], b = K[i];
            const u = E(b.ease)(Math.min(1, Math.max(0, (t - a.t) / (b.t - a.t))));
            return { cx: lerp(a.cx, b.cx, u), cy: lerp(a.cy, b.cy, u), z: Math.exp(lerp(Math.log(a.z), Math.log(b.z), u)) };
          }
        }
      }
      const CX0 = 2200;
      [["#bg", 0.82], ["#mid", 1.0], ["#fg", 1.35]].forEach(([sel, d]) => {
        drive(sel, (u) => {
          const c = camAt(u * 19.6);
          const z = 1 + (c.z - 1) * d;
          const cx = CX0 + (c.cx - CX0) * d;
          return { x: 960 - cx * z, y: 540 - c.cy * z, scale: z, transformOrigin: "0 0" };
        }, 0, 19.6, 20);
      });

      // depth of field: background softens as we push into the screen
      tl.fromTo("#bg", { filter: "blur(1px)" }, { filter: "blur(3px)", duration: 6, ease: "sine.inOut" }, 1);

      // ---------- dashboard populates ----------
      tl.fromTo("#dash .appt", { opacity: 0 }, { opacity: 1, duration: 0.5, stagger: 0.3, ease: "sine.out" }, 0.8);

      // ---------- headline ----------
      tl.fromTo("#scene", { opacity: 0 }, { opacity: 1, duration: 0.9, ease: "sine.out" }, 0);
      tl.fromTo("#h1 .w", { opacity: 0, y: 22, filter: "blur(8px)" },
        { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.9, stagger: 0.14, ease: "power3.out" }, 0.9);
      tl.to("#h1 .w", { opacity: 0, y: -16, filter: "blur(8px)", duration: 0.6, stagger: 0.04, ease: "power2.in" }, 4.2);
      tl.fromTo("#h2 .w", { opacity: 0, y: 22, filter: "blur(8px)" },
        { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.9, stagger: 0.14, ease: "power3.out" }, 5.05);
      tl.to("#h2 .w", { opacity: 0, filter: "blur(6px)", duration: 0.6, stagger: 0.03, ease: "power1.in" }, 7.25);
      tl.to("#scrim", { opacity: 0, duration: 1.0, ease: "sine.inOut" }, 7.3);

      // ---------- connection line ----------
      const conn = document.getElementById("conn");
      const L = conn.getTotalLength();
      const P0 = 6.9, P1 = 12.85, pe = E("power1.inOut");
      const pAt = (u) => pe(u);
      tl.set(["#conn", "#connGlow"], { attr: { "stroke-dasharray": L + " " + L, "stroke-dashoffset": L } }, 0);
      drive(["#conn", "#connGlow"], (u) => ({ attr: { "stroke-dashoffset": L * (1 - pAt(u)) } }), P0, P1, 24);
      drive("#cHead", (u) => {
        const pt = conn.getPointAtLength(L * pAt(u));
        return { x: pt.x, y: pt.y };
      }, P0, P1, 24);
      tl.fromTo("#cHead", { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "sine.out" }, P0 - 0.15);
      tl.to("#cHead", { opacity: 0, duration: 0.6, ease: "sine.in" }, P1 - 0.05);

      // lock — appears as the line passes through, shackle closes on the chime
      tl.fromTo("#lock", { opacity: 0, scale: 0.86, svgOrigin: "2400 430" }, { opacity: 1, scale: 1, duration: 0.55, ease: "power2.out" }, 9.45);
      tl.fromTo("#shackle", { y: -6 }, { y: 0, duration: 0.22, ease: "power2.in" }, 9.78);
      tl.fromTo("#lockRing", { attr: { r: 40 }, opacity: 0.55 }, { attr: { r: 70 }, opacity: 0, duration: 1.3, ease: "sine.out" }, 9.95);
      tl.to("#lock", { opacity: 0, duration: 0.7, ease: "sine.inOut" }, 11.2);

      // arrival — laptop wakes with the same dashboard
      tl.to("#lapGlow", { opacity: 0.55, duration: 0.25, ease: "sine.out" }, 12.8);
      tl.to("#lapDim", { opacity: 0, duration: 0.6, ease: "sine.out" }, 12.85);
      tl.to("#lapGlow", { opacity: 0, duration: 0.9, ease: "sine.inOut" }, 13.05);
      tl.to(["#conn", "#connGlow"], { opacity: 0.25, duration: 1.6, ease: "sine.inOut" }, 13.6);

      // dentist: calm breathing + small typing motion
      tl.fromTo("#dentist", { y: 0 }, { y: -2.5, duration: 1.8, ease: "sine.inOut", repeat: 9, yoyo: true }, 0);
      tl.fromTo("#armL", { x: 0 }, { x: -3, duration: 0.45, ease: "sine.inOut", repeat: 13, yoyo: true }, 13.4);
      tl.fromTo("#head", { rotation: 0, svgOrigin: "3834 690" }, { rotation: -2, duration: 2.4, ease: "sine.inOut", repeat: 3, yoyo: true }, 12.0);

      // ---------- remote access title ----------
      tl.to("#scrim3", { opacity: 1, duration: 1.0, ease: "sine.inOut" }, 13.1);
      tl.fromTo("#ra", { opacity: 0, x: -18, filter: "blur(6px)" },
        { opacity: 1, x: 0, filter: "blur(0px)", duration: 1.4, ease: "power3.out" }, 13.6);
      tl.fromTo("#ra-sub", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 1.0, ease: "power2.out" }, 15.0);
      tl.to(["#ra", "#ra-sub"], { opacity: 0, duration: 0.6, ease: "sine.in" }, 18.2);

      // ---------- end card ----------
      tl.to("#scene", { opacity: 0, filter: "blur(10px)", duration: 1.0, ease: "sine.inOut" }, 18.6);
      tl.fromTo("#endcard", { opacity: 0 }, { opacity: 1, duration: 0.9, ease: "sine.inOut" }, 18.6);
      tl.fromTo("#logo", { opacity: 0, scale: 0.97, filter: "blur(6px)" },
        { opacity: 1, scale: 1, filter: "blur(0px)", duration: 1.2, ease: "power2.out" }, 19.2);
      const sw = document.getElementById("sweepLine");
      const SL = sw.getTotalLength();
      tl.set(["#sweepLine", "#sweepGlow"], { attr: { "stroke-dasharray": SL + " " + SL, "stroke-dashoffset": SL } }, 0);
      tl.to(["#sweepLine", "#sweepGlow"], { attr: { "stroke-dashoffset": 0 }, duration: 1.3, ease: "power2.inOut" }, 20.0);
      tl.to(["#sweepLine", "#sweepGlow"], { attr: { "stroke-dashoffset": -SL }, duration: 1.4, ease: "power2.inOut" }, 21.35);
      tl.to(["#sweepLine", "#sweepGlow"], { opacity: 0, duration: 0.6, ease: "sine.in" }, 22.0);
      tl.fromTo("#final .w", { opacity: 0, y: 14, filter: "blur(6px)" },
        { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.9, stagger: 0.16, ease: "power3.out" }, 21.0);

      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
